# 6a Q2: kube-state-metrics — 产 kube_pod_status_ready / kube_pod_container_status_restarts_total
# / kube_deployment_status_replicas_ready 等(上游 27 指标里的状态类)。
# NodePort 暴露给宿主 compose Prometheus scrape(host.docker.internal:30090)。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: recweb-chaos
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics-recweb
rules:
  - apiGroups: [""]
    resources: [pods, services, nodes, endpoints, namespaces, configmaps, secrets, replicationcontrollers, resourcequotas, persistentvolumes, persistentvolumeclaims]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics-recweb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics-recweb
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: recweb-chaos
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: recweb-chaos
  labels:
    app: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      enableServiceLinks: false
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
          ports:
            - name: metrics
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "192Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: recweb-chaos
  labels:
    app: kube-state-metrics
spec:
  type: NodePort
  selector:
    app: kube-state-metrics
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
      nodePort: 30090
