# 46-pricing.yaml — pricing_service Deployment + ClusterIP Service (B-trade 族)
# ----------------------------------------------------------------------------
# pricing_service(:5014) 定价: 调 catalog 取基价 × markup × tax = 含税终价。
# - 有 DB(mysql-connector 池): DB_HOST=host.docker.internal。
#   ⚠⚠ 启动幂等建表(writes_db_on_startup): 容器首启对 shopify2 CREATE TABLE IF NOT EXISTS
#       price_rules(自有新表)。需 recweb_k8s 有 DDL 权限。【风险点, 见 notes】
# - 下游 catalog_service(取基价): CATALOG_SERVICE_URL=http://catalog:5005。
# - 去 Nacos: NACOS_ENABLED=false。/health 路由【确认存在】(app.py:305)。label app=pricing。
# ----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing
  namespace: recweb-chaos
  labels:
    app: pricing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pricing
  template:
    metadata:
      labels:
        app: pricing
    spec:
      enableServiceLinks: false   # 防 K8S 注入 PRICING_SERVICE_HOST/PORT 撞应用 bind 变量
      containers:
        - name: pricing
          image: recweb-pricing:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5014          # 源码实测: PRICING_SERVICE_PORT 默认 5014
          env:
            - name: NACOS_ENABLED
              value: "false"
            - name: PRICING_SERVICE_HOST
              value: "0.0.0.0"
            # ---- 下游 catalog(取基价): 指向集群内 svc 名 ----
            - name: CATALOG_SERVICE_URL
              value: "http://catalog:5005"
            # ---- DB 外接宿主 MySQL(启动建 price_rules 表) ----
            - name: DB_HOST
              value: "host.docker.internal"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "shopify2"
            - name: DB_USER
              value: "recweb_k8s"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-cred
                  key: password
            # ---- OTel ----
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: "pricing_service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://host.docker.internal:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            # ---- K8s downward-API -> OTEL_RESOURCE_ATTRIBUTES (labels-enrichment: pod/ns/node resource attrs) ----
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME)"
          readinessProbe:
            httpGet:
              path: /health
              port: 5014
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5014
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: pricing          # 集群内 DNS: pricing.recweb-chaos.svc
  namespace: recweb-chaos
  labels:
    app: pricing
spec:
  type: ClusterIP
  selector:
    app: pricing
  ports:
    - name: http
      port: 5014
      targetPort: 5014
