# 20-interaction.yaml — interaction_service Deployment + ClusterIP Service (C-content 族)
# ----------------------------------------------------------------------------
# interaction_service(:5020) 交互埋点写中枢(多端 fan-in, 叶子)。仿 M0 catalog 模板。
# - DB 外接宿主 MySQL: DB_HOST=host.docker.internal(interactions 表写埋点 + 读最近交互,
#   非 items/inventory, 不违反只读铁律)。
# - 去 Nacos: NACOS_ENABLED=false → 无下游服务调用。
# - OTLP 复用宿主 collector: host.docker.internal:4317(gRPC)。
# - label app=interaction; /health 路由【确认存在】(app.py:296)。
# - enableServiceLinks:false + 显式 INTERACTION_SERVICE_HOST=0.0.0.0 防撞 bind。
# ----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: interaction
  namespace: recweb-chaos
  labels:
    app: interaction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: interaction
  template:
    metadata:
      labels:
        app: interaction
    spec:
      enableServiceLinks: false
      containers:
        - name: interaction
          image: recweb-interaction:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5020          # 源码实测: INTERACTION_SERVICE_PORT 默认 5020
          env:
            - name: NACOS_ENABLED
              value: "false"
            - name: INTERACTION_SERVICE_HOST
              value: "0.0.0.0"
            - name: DB_HOST
              value: "host.docker.internal"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "shopify2"
            - name: DB_USER
              value: "recweb_k8s"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-cred
                  key: password
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: "interaction_service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://host.docker.internal:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            # ---- K8s downward-API -> OTEL_RESOURCE_ATTRIBUTES (labels-enrichment: pod/ns/node resource attrs) ----
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME)"
          readinessProbe:
            httpGet:
              path: /health
              port: 5020
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5020
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: interaction
  namespace: recweb-chaos
  labels:
    app: interaction
spec:
  type: ClusterIP
  selector:
    app: interaction
  ports:
    - name: http
      port: 5020
      targetPort: 5020
