# 47-promotion.yaml — promotion_service Deployment + ClusterIP Service (B-trade 族)
# ----------------------------------------------------------------------------
# promotion_service(:5015) 促销/优惠券: 列有效优惠 / 校验券码。独立无下游服务。
# - 有 DB(mysql-connector 池): DB_HOST=host.docker.internal。
#   ⚠⚠ 启动幂等建表(writes_db_on_startup): 容器首启对 shopify2 CREATE TABLE IF NOT EXISTS
#       promotions(自有新表)。需 recweb_k8s 有 DDL 权限。【风险点, 见 notes】
# - 去 Nacos: NACOS_ENABLED=false。/health 路由【确认存在】(app.py:278)。label app=promotion。
# ----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: promotion
  namespace: recweb-chaos
  labels:
    app: promotion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: promotion
  template:
    metadata:
      labels:
        app: promotion
    spec:
      enableServiceLinks: false   # 防 K8S 注入 PROMOTION_SERVICE_HOST/PORT 撞应用 bind 变量
      containers:
        - name: promotion
          image: recweb-promotion:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5015          # 源码实测: PROMOTION_SERVICE_PORT 默认 5015
          env:
            - name: NACOS_ENABLED
              value: "false"
            - name: PROMOTION_SERVICE_HOST
              value: "0.0.0.0"
            # ---- DB 外接宿主 MySQL(启动建 promotions 表) ----
            - name: DB_HOST
              value: "host.docker.internal"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "shopify2"
            - name: DB_USER
              value: "recweb_k8s"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-cred
                  key: password
            # ---- OTel ----
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: "promotion_service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://host.docker.internal:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            # ---- K8s downward-API -> OTEL_RESOURCE_ATTRIBUTES (labels-enrichment: pod/ns/node resource attrs) ----
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME)"
          readinessProbe:
            httpGet:
              path: /health
              port: 5015
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5015
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: promotion          # 集群内 DNS: promotion.recweb-chaos.svc
  namespace: recweb-chaos
  labels:
    app: promotion
spec:
  type: ClusterIP
  selector:
    app: promotion
  ports:
    - name: http
      port: 5015
      targetPort: 5015
