# 09-announcement.yaml — announcement_service Deployment + ClusterIP Service (C-content 族)
# ----------------------------------------------------------------------------
# announcement_service(:5009) 公告读写(买家读已发布 + 管理端状态流转)。仿 M0 catalog 模板。
# - DB 外接宿主 MySQL: DB_HOST=host.docker.internal(announcements 表读写)。
# - 去 Nacos: NACOS_ENABLED=false → 无下游服务调用。
# - OTLP 复用宿主 collector: host.docker.internal:4317(gRPC)。
# - label app=announcement; /health 路由【确认存在】(app.py:334)。
# - enableServiceLinks:false + 显式 ANNOUNCEMENT_SERVICE_HOST=0.0.0.0 防撞 bind。
# ----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: announcement
  namespace: recweb-chaos
  labels:
    app: announcement
spec:
  replicas: 1
  selector:
    matchLabels:
      app: announcement
  template:
    metadata:
      labels:
        app: announcement
    spec:
      enableServiceLinks: false
      containers:
        - name: announcement
          image: recweb-announcement:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5009          # 源码实测: ANNOUNCEMENT_SERVICE_PORT 默认 5009
          env:
            - name: NACOS_ENABLED
              value: "false"
            - name: ANNOUNCEMENT_SERVICE_HOST
              value: "0.0.0.0"
            - name: DB_HOST
              value: "host.docker.internal"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "shopify2"
            - name: DB_USER
              value: "recweb_k8s"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-cred
                  key: password
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: "announcement_service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://host.docker.internal:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            # ---- K8s downward-API -> OTEL_RESOURCE_ATTRIBUTES (labels-enrichment: pod/ns/node resource attrs) ----
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME)"
          readinessProbe:
            httpGet:
              path: /health
              port: 5009
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5009
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: announcement
  namespace: recweb-chaos
  labels:
    app: announcement
spec:
  type: ClusterIP
  selector:
    app: announcement
  ports:
    - name: http
      port: 5009
      targetPort: 5009
