# 21-notification.yaml — notification_service Deployment + ClusterIP Service (C-content 族)
# ----------------------------------------------------------------------------
# notification_service(:5021) 通知叶子(被 order/payment/shipping fan-in)。仿 M0 catalog 模板。
# - DB 外接宿主 MySQL: DB_HOST=host.docker.internal(notifications 自有表读写, 非 items/inventory)。
# ⚠ 启动写库(writes_db_on_startup): __main__ 在 app.run 前调 _ensure_schema()
#   幂等 CREATE TABLE IF NOT EXISTS notifications(app.py:164/344)。
#   → recweb_k8s 用户需对 shopify2 有 CREATE 权限(M0 catalog 用的是只读用户)。
#     若沿用纯只读 recweb_k8s, 建表会失败, 但源码 try/except 容错(只打 [schema] 日志不 crash),
#     表已存在时(schema.sql 已建)即 no-op 不报错。
#     主循环上线本服务前请确认 notifications 表已存在 或 给 recweb_k8s 授 CREATE/INSERT(见 notes)。
# - 去 Nacos: NACOS_ENABLED=false → 无下游服务调用(notification 是叶子)。
# - OTLP 复用宿主 collector: host.docker.internal:4317(gRPC)。
# - label app=notification; /health 路由【确认存在】(app.py:314)。
# - enableServiceLinks:false + 显式 NOTIFICATION_SERVICE_HOST=0.0.0.0 防撞 bind。
# ----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: recweb-chaos
  labels:
    app: notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      enableServiceLinks: false
      containers:
        - name: notification
          image: recweb-notification:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5021          # 源码实测: NOTIFICATION_SERVICE_PORT 默认 5021
          env:
            - name: NACOS_ENABLED
              value: "false"
            - name: NOTIFICATION_SERVICE_HOST
              value: "0.0.0.0"
            - name: DB_HOST
              value: "host.docker.internal"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "shopify2"
            - name: DB_USER
              value: "recweb_k8s"   # ⚠ 若为纯只读用户, 启动 _ensure_schema() 建表失败但容错不崩溃(见顶部说明)
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-cred
                  key: password
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: "notification_service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://host.docker.internal:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            # ---- K8s downward-API -> OTEL_RESOURCE_ATTRIBUTES (labels-enrichment: pod/ns/node resource attrs) ----
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME)"
          readinessProbe:
            httpGet:
              path: /health
              port: 5021
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5021
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: notification
  namespace: recweb-chaos
  labels:
    app: notification
spec:
  type: ClusterIP
  selector:
    app: notification
  ports:
    - name: http
      port: 5021
      targetPort: 5021
