# 42-order.yaml — order_service Deployment + ClusterIP Service (B-trade 族)
# ----------------------------------------------------------------------------
# order_service(:5010) 订单只读(列表/详情+订单行); 可选 enrich 经 HTTP 调 catalog 补当前商品。
# - 有 DB(mysql-connector 池): DB_HOST=host.docker.internal 外接宿主 MySQL shopify2(只读 orders/order_items)。
# - 下游 catalog_service(可选 enrich): CATALOG_SERVICE_URL=http://catalog:5005。
# - 去 Nacos: NACOS_ENABLED=false → get_catalog_service_url() 走 env fallback。
# - /health 路由【确认存在】(app.py:498)。label app=order。
# ----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: recweb-chaos
  labels:
    app: order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      enableServiceLinks: false   # 防 K8S 注入 ORDER_SERVICE_HOST/PORT 撞应用 bind 变量
      containers:
        - name: order
          image: recweb-order:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5010          # 源码实测: ORDER_SERVICE_PORT 默认 5010
          env:
            - name: NACOS_ENABLED
              value: "false"
            - name: ORDER_SERVICE_HOST
              value: "0.0.0.0"
            # ---- 下游 catalog(可选 enrich): 指向集群内 svc 名 ----
            - name: CATALOG_SERVICE_URL
              value: "http://catalog:5005"
            # ---- DB 外接宿主 MySQL ----
            - name: DB_HOST
              value: "host.docker.internal"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "shopify2"
            - name: DB_USER
              value: "recweb_k8s"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-cred
                  key: password
            # ---- OTel ----
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: "order_service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://host.docker.internal:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            # ---- K8s downward-API -> OTEL_RESOURCE_ATTRIBUTES (labels-enrichment: pod/ns/node resource attrs) ----
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME)"
          readinessProbe:
            httpGet:
              path: /health
              port: 5010
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5010
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: order          # 集群内 DNS: order.recweb-chaos.svc
  namespace: recweb-chaos
  labels:
    app: order
spec:
  type: ClusterIP
  selector:
    app: order
  ports:
    - name: http
      port: 5010
      targetPort: 5010
