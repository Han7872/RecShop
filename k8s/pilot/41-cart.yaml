# 41-cart.yaml — cart_service Deployment + ClusterIP Service (B-trade 族)
# ----------------------------------------------------------------------------
# cart_service(:5006) 购物车增改删计数; 深度链 cart→catalog 取商品价格 + 尽力写 interactions。
# - 有 DB(mysql-connector 池): DB_HOST=host.docker.internal 外接宿主 MySQL shopify2。
#   ⚠ 写 cart_items / 尽力写 interactions(写路径, 非 items/inventory 只读基线覆盖, 但与铁律无关)。
# - 下游 catalog_service: CATALOG_SERVICE_URL 指集群内 svc 名 http://catalog:5005(去 Nacos fallback)。
# - 去 Nacos: NACOS_ENABLED=false → get_catalog_service_url() 走 env fallback。
# - /health 路由【确认存在】(app.py:411)。label app=cart。
# ----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: recweb-chaos
  labels:
    app: cart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
    spec:
      enableServiceLinks: false   # 防 K8S 注入 CART_SERVICE_HOST/PORT 撞应用 bind 变量
      containers:
        - name: cart
          image: recweb-cart:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5006          # 源码实测: CART_SERVICE_PORT 默认 5006
          env:
            - name: NACOS_ENABLED
              value: "false"
            - name: CART_SERVICE_HOST
              value: "0.0.0.0"
            # ---- 下游 catalog: 指向集群内 svc 名 ----
            - name: CATALOG_SERVICE_URL
              value: "http://catalog:5005"
            # ---- DB 外接宿主 MySQL ----
            - name: DB_HOST
              value: "host.docker.internal"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "shopify2"
            - name: DB_USER
              value: "recweb_k8s"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-cred
                  key: password
            # ---- OTel ----
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: "cart_service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://host.docker.internal:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            # ---- K8s downward-API -> OTEL_RESOURCE_ATTRIBUTES (labels-enrichment: pod/ns/node resource attrs) ----
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME)"
          readinessProbe:
            httpGet:
              path: /health
              port: 5006
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5006
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: cart          # 集群内 DNS: cart.recweb-chaos.svc
  namespace: recweb-chaos
  labels:
    app: cart
spec:
  type: ClusterIP
  selector:
    app: cart
  ports:
    - name: http
      port: 5006
      targetPort: 5006
